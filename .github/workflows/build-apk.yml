
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Premium App
        run: |
          mkdir -p /tmp/zoomhamrah
          unzip -o zoomhamrah-premium-v2.zip -d /tmp/zoomhamrah
          cp -r /tmp/zoomhamrah/lib .
          cp -r /tmp/zoomhamrah/assets .
          cp /tmp/zoomhamrah/pubspec.yaml .
          mkdir -p android/app/src/main
          cp /tmp/zoomhamrah/android/app/src/main/AndroidManifest.xml android/app/src/main/

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: zoomhamrah-premium-apk
          path: build/app/outputs/flutter-apk/app-release.apk
